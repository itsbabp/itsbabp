name: update stats card

on:
  schedule:
    - cron: "17 3 * * *"      # once a day
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - ".github/scripts/gen_stats.py"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build assets/stats.svg
        env:
          OWNER: ${{ github.repository_owner }}
          # Add a repo secret called STATS_TOKEN (a personal access token) to count private repos and contributions.
          # Without it, the built-in token is used and only public data is counted.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "update stats card" && git push)
